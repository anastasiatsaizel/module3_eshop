{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}BuildingMarket{% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>

<body>

<header>
    {% include 'includes/menu.html' %}
</header>


<main>
    <!-- Всплывающие сообщения (messages) -->
{% if messages %}
    <div class="messages-container" style="max-width: 800px; margin: 15px auto; padding: 0 15px;">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="padding: 12px 20px; border-radius: 6px; margin-bottom: 10px; font-weight: 500; text-align: center; display: flex; justify-content: center; align-items: center;
                {% if message.tags == 'success' %}
                    background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                {% elif message.tags == 'error' %}
                    background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
                {% else %}
                    background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db;
                {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    </div>
{% endif %}

    {% block content %}
    {% endblock %}
</main>


<footer>
    <p>© 2026 BuildingMaterials | All you need for your future house </p>
</footer>

</body>
</html>
