{% extends "base.html" %}


{% block title %}
Login
{% endblock %}


{% block content %}

<div class="form-box">

<h1>
    Login 🌿
</h1>


<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}

  {% for field in form %}
    <div>
      {{ field.label_tag }}
      {{ field }}
      {{ field.errors }}
    </div>
  {% endfor %}

  <button type="submit">Enter</button>
</form>

</div>

{% endblock %}
